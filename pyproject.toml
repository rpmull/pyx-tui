[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixra"
version = "0.1.0"
description = "A terminal (TUI) editor for drawing Pyxra pixel maps out of ASCII characters"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["windows-curses>=2.3; sys_platform == 'win32'"]
classifiers = [
    "Environment :: Console :: Curses",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
]

[project.scripts]
pixra = "pixra.cli:main"

[tool.setuptools]
packages = ["pixra"]
